name: Go CI/CD Example

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: 1.20

      - name: Verify Go version
        run: go version

      - name: Install dependencies
        run: go mod tidy

      - name: Run tests
        run: go test ./... -v

  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy the Server
        run: |
          echo "Deploying application..."
          echo "Deployed successfully!"
